# Example deployment. There is no Service or Ingress on purpose: the only
# ingress is the gram tunnel agent, which dials out to the gateway.
#
# MCP listens on 127.0.0.1 so nothing else in the cluster can reach it; the
# in-process tunnel agent dials loopback. Kubelet probes hit the pod IP, not
# loopback, so --health-listen serves only /healthz and /readyz on 8081.
apiVersion: v1
kind: Secret
metadata:
  name: restrictedsql-mcp
type: Opaque
stringData:
  DATABASE_URL: postgres://readonly_role:change-me@db.example.internal:5432/app?sslmode=require
  TUNNEL_GATEWAY_URL: wss://gateway.example.com/tunnel
  TUNNEL_KEY: change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restrictedsql-mcp
  labels:
    app: restrictedsql-mcp
spec:
  # Write transactions are process-local; keep a single replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: restrictedsql-mcp
  template:
    metadata:
      labels:
        app: restrictedsql-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restrictedsql-mcp
          image: ghcr.io/example/restrictedsql-mcp:v0.1.0
          args:
            - --dialect=postgres
            - --read-tables=public.allowed_orders,public.allowed_customers
            # For annotation mode, replace --read-tables with these flags and
            # supply a bootstrap DATABASE_URL (see docs/column-access.md):
            # - --columns-from-annotations=confidential
            # - --connection-level-security
            # - --annotation-refresh-interval=30s
            # Stop/drain ALL MCP instances before restrictive or meaning-changing
            # migrations; restart and verify readiness before reopening access.
            - --listen=127.0.0.1:8080
            - --health-listen=0.0.0.0:8081
            - --statement-timeout=30s
            - --max-rows=1000
            - --log-level=info
            - --tunnel
            - --tunnel-only   # only the in-process tunnel agent may reach /mcp; probes still hit /healthz and /readyz
            # Provision least-privilege roles from DATABASE_URL (which then needs
            # CREATEROLE and GRANT OPTION on the allowlisted tables) and run
            # tool traffic as them. Keep replicas at 1: passwords rotate per boot.
            # - --connection-level-security
            # - --security-role-prefix=restrictedsql
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: restrictedsql-mcp
                  key: DATABASE_URL
            - name: TUNNEL_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: restrictedsql-mcp
                  key: TUNNEL_GATEWAY_URL
            - name: TUNNEL_KEY
              valueFrom:
                secretKeyRef:
                  name: restrictedsql-mcp
                  key: TUNNEL_KEY
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

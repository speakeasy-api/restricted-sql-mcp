name: Release

# Changesets keeps a "chore: version packages" PR open on main. Merging it
# tags vX.Y.Z and creates the GitHub release; the image job then builds,
# pushes and signs ghcr.io/speakeasy-api/restricted-sql-mcp:X.Y.Z, :X.Y and
# :latest. Deploy by digest, not by tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/speakeasy-api/restricted-sql-mcp

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to push the version branch, tags and releases
      pull-requests: write # to open the version packages PR
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: changesets looks up the commit that added each
          # changeset, and must not need to fetch without credentials.
          fetch-depth: 0
          persist-credentials: false # changesets pushes with its github-token

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          version-script: npm run version
          publish-script: npm run release

  image:
    name: Release image
    needs: [release]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # for cosign keyless signing
      packages: write # to push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        name: Read version
        run: |
          v=$(jq -r .version package.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=v${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/speakeasy-api/restricted-sql-mcp
            org.opencontainers.image.description=restricted-sql-mcp: an MCP server giving agents allowlisted SQL over Postgres and ClickHouse
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Summary
        run: echo "Released \`${IMAGE}:${VERSION}\` as \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}

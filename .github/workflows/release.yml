name: Release

# Changesets keeps a "chore: version packages" PR open on main. Merging it
# tags vX.Y.Z and creates the GitHub release; the image job (image.yml) then
# builds, pushes and signs ghcr.io/speakeasy-api/restricted-sql-mcp:X.Y.Z, :X.Y
# and :latest. Deploy by digest, not by tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to push the version branch, tags and releases
      pull-requests: write # to open the version packages PR
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: changesets looks up the commit that added each
          # changeset, and must not need to fetch without credentials.
          fetch-depth: 0
          persist-credentials: false # changesets pushes with its github-token

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          version-script: npm run version
          publish-script: npm run release

      - id: version
        name: Read version
        run: |
          v=$(jq -r .version package.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"

  image:
    name: Release image
    needs: [release]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read # to check out the source
      id-token: write # for cosign keyless signing
      packages: write # to push the image to ghcr.io
    uses: ./.github/workflows/image.yml
    with:
      version: v${{ needs.release.outputs.version }}
      tags: |
        ${{ needs.release.outputs.version }}
        ${{ needs.release.outputs.minor }}
        latest

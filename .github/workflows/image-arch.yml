name: Image (one platform)

# Builds the image for one platform on a native runner and pushes it by
# digest only (no tag). image.yml merges the platforms into tagged manifests.
# Native runners, not QEMU: the cgo build of libpg_query took ~25 minutes
# emulated on arm64 against ~3 natively.
on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      runner:
        type: string
        required: true
      version:
        type: string
        required: true
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

env:
  IMAGE: ghcr.io/speakeasy-api/restricted-sql-mcp

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read # to check out the source
      packages: write # to push the image to ghcr.io
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ inputs.platform }}
          build-args: VERSION=${{ inputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/speakeasy-api/restricted-sql-mcp
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.description=restricted-sql-mcp: an MCP server giving agents allowlisted SQL over Postgres and ClickHouse
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

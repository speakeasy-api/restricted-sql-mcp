name: Image

# Builds amd64 and arm64 in parallel on native runners, merges them into one
# multi-platform manifest under each tag, and signs it with cosign (keyless).
on:
  workflow_call:
    inputs:
      tags:
        description: Newline-separated tags (without the image name)
        type: string
        required: true
      version:
        type: string
        required: true
    outputs:
      digest:
        value: ${{ jobs.merge.outputs.digest }}

permissions: {}

env:
  IMAGE: ghcr.io/speakeasy-api/restricted-sql-mcp

jobs:
  amd64:
    permissions:
      contents: read # to check out the source
      packages: write # to push the platform image to ghcr.io
    uses: ./.github/workflows/image-arch.yml
    with:
      platform: linux/amd64
      runner: blacksmith-8vcpu-ubuntu-2404
      version: ${{ inputs.version }}

  arm64:
    permissions:
      contents: read # to check out the source
      packages: write # to push the platform image to ghcr.io
    uses: ./.github/workflows/image-arch.yml
    with:
      platform: linux/arm64
      runner: blacksmith-8vcpu-ubuntu-2404-arm
      version: ${{ inputs.version }}

  merge:
    name: Merge and sign
    needs: [amd64, arm64]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      id-token: write # for cosign keyless signing
      packages: write # to push the manifest to ghcr.io
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: merge
        name: Merge platforms
        env:
          TAGS: ${{ inputs.tags }}
          AMD64: ${{ needs.amd64.outputs.digest }}
          ARM64: ${{ needs.arm64.outputs.digest }}
        run: |
          args=()
          while read -r tag; do
            [ -n "$tag" ] && args+=(-t "${IMAGE}:${tag}")
          done <<<"$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          first=$(head -n1 <<<"$TAGS")
          digest=$(docker buildx imagetools inspect "${IMAGE}:${first}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}

      - name: Summary
        run: |
          {
            echo "\`${IMAGE}@${DIGEST}\`, tagged:"
            sed 's/^/- /' <<<"$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          TAGS: ${{ inputs.tags }}
